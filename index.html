<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✈ Flight Price Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f3;color:#1a1a18;min-height:100vh;padding-bottom:4rem}
.container{max-width:960px;margin:0 auto;padding:0 16px}
h1{font-size:26px;font-weight:500;margin-bottom:6px}
.sub{font-size:14px;color:#6b6b68}
.header{padding:2rem 0 1.25rem;border-bottom:1px solid #e5e5e3;margin-bottom:1.5rem}
.card{background:#fff;border:1px solid #e5e5e3;border-radius:12px;padding:1.25rem;margin-bottom:12px}
label{font-size:12px;color:#6b6b68;display:block;margin-bottom:4px}
input,select{width:100%;padding:9px 12px;border:1px solid #e5e5e3;border-radius:6px;background:#f5f5f3;color:#1a1a18;font-size:14px;height:38px;outline:none}
input:focus,select:focus{border-color:#1D9E75}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
.field{display:flex;flex-direction:column;flex:1;min-width:140px}
.swap{width:36px;height:38px;border-radius:50%;border:1px solid #e5e5e3;background:#f5f5f3;font-size:18px;cursor:pointer;flex-shrink:0}
.search-btn{width:100%;height:38px;background:#1D9E75;color:#fff;border:none;border-radius:8px;font-weight:500;font-size:14px;cursor:pointer}
.search-btn:disabled{opacity:0.5;cursor:not-allowed}
.trip-toggle{display:flex;gap:8px;margin-bottom:14px}
.trip-btn{padding:7px 20px;border-radius:100px;border:1px solid #e5e5e3;background:#fff;font-size:13px;cursor:pointer;font-weight:400}
.trip-btn.active{background:#1D9E75;color:#fff;border-color:#1D9E75;font-weight:500}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{padding:7px 16px;border-radius:8px;font-size:13px;border:1px solid #e5e5e3;background:#fff;cursor:pointer}
.tab.active{background:#f5f5f3;font-weight:500}
.empty{text-align:center;padding:3rem 1rem;background:#fff;border:1px solid #e5e5e3;border-radius:12px}
.flight-card{background:#fff;border:1px solid #e5e5e3;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:16px;margin-bottom:8px;cursor:pointer;text-decoration:none;color:inherit}
.flight-card:hover{border-color:#1D9E75}
.flight-card.best{border-color:#1D9E75}
.airline-logo{width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0}
.flight-left{display:flex;align-items:center;gap:12px;flex:2;min-width:0}
.flight-mid{flex:1;text-align:center}
.flight-right{flex:1;text-align:right}
.price{font-size:20px;font-weight:500}
.price.best-price{color:#1D9E75}
.muted{font-size:12px;color:#6b6b68}
.best-badge{font-size:11px;padding:2px 8px;border-radius:100px;background:#E1F5EE;color:#085041;font-weight:500;margin-left:6px}
.stops-badge{font-size:12px;padding:3px 10px;border-radius:100px;border:1px solid #e5e5e3;color:#6b6b68}
.book-btn{font-size:13px;padding:5px 12px;border-radius:6px;border:1px solid #e5e5e3;background:#fff;display:inline-block;margin-top:6px}
.error{margin-top:10px;padding:10px 14px;background:#FCEBEB;border:1px solid #F09595;border-radius:8px;font-size:13px;color:#A32D2D}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 10px;border-bottom:1px solid #e5e5e3;color:#6b6b68;font-weight:500;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #e5e5e3;vertical-align:middle}
tr.best-row td{background:#E1F5EE}
.cheapest-badge{font-size:11px;padding:2px 8px;border-radius:100px;background:#E1F5EE;color:#085041;font-weight:500}
.link-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #e5e5e3}
.src-logo{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;flex-shrink:0}
.open-btn{font-size:13px;padding:5px 12px;border-radius:6px;border:1px solid #e5e5e3;background:#fff;color:#1a1a18;text-decoration:none;white-space:nowrap}
.open-all-btn{padding:8px 16px;background:#1D9E75;color:#fff;border:none;border-radius:8px;font-weight:500;cursor:pointer;margin-bottom:16px}
.sec-label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:#6b6b68;margin:12px 0 8px}
.filter-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.chip{padding:4px 12px;border-radius:100px;font-size:12px;border:1px solid #e5e5e3;background:#fff;cursor:pointer}
.chip.active{background:#f5f5f3;font-weight:500}
.oneway-note{font-size:12px;color:#6b6b68;background:#f5f5f3;border-radius:6px;padding:6px 10px;margin-bottom:10px;display:inline-block}
@media(max-width:600px){.flight-card{flex-wrap:wrap}.flight-mid,.flight-right{flex:unset;width:100%;text-align:left}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>✈ Flight Price Portal</h1>
    <p class="sub">Compare airlines & aggregators · One Way & Round Trip · Click any result to book</p>
  </div>

  <div class="card">
    <!-- Trip type toggle -->
    <div class="trip-toggle">
      <button class="trip-btn active" id="btnRT" onclick="setTripType('round')">⇄ Round Trip</button>
      <button class="trip-btn" id="btnOW" onclick="setTripType('oneway')">→ One Way</button>
    </div>

    <div class="row">
      <div class="field"><label>From</label>
        <select id="origin">
          <option value="AUH">Abu Dhabi (AUH)</option><option value="DXB">Dubai (DXB)</option><option value="DOH">Doha (DOH)</option><option value="RUH">Riyadh (RUH)</option><option value="KWI">Kuwait City (KWI)</option><option value="BAH">Bahrain (BAH)</option><option value="MCT">Muscat (MCT)</option><option value="LHR">London Heathrow (LHR)</option><option value="LGW">London Gatwick (LGW)</option><option value="JFK">New York JFK (JFK)</option><option value="LAX">Los Angeles (LAX)</option><option value="CDG">Paris CDG (CDG)</option><option value="FRA">Frankfurt (FRA)</option><option value="AMS">Amsterdam (AMS)</option><option value="SIN">Singapore (SIN)</option><option value="BOM">Mumbai (BOM)</option><option value="DEL">Delhi (DEL)</option><option value="CMB">Colombo (CMB)</option><option value="MNL">Manila (MNL)</option><option value="KHI">Karachi (KHI)</option><option value="SYD">Sydney (SYD)</option><option value="NRT">Tokyo (NRT)</option><option value="BKK">Bangkok (BKK)</option><option value="KUL">Kuala Lumpur (KUL)</option><option value="CAI">Cairo (CAI)</option><option value="AMM">Amman (AMM)</option><option value="IST">Istanbul (IST)</option><option value="FCO">Rome (FCO)</option><option value="MAD">Madrid (MAD)</option>
        </select>
      </div>
      <button class="swap" onclick="swapAirports()">⇄</button>
      <div class="field"><label>To</label>
        <select id="dest">
          <option value="LHR">London Heathrow (LHR)</option><option value="JFK">New York JFK (JFK)</option><option value="CDG">Paris CDG (CDG)</option><option value="SIN">Singapore (SIN)</option><option value="BOM">Mumbai (BOM)</option><option value="DEL">Delhi (DEL)</option><option value="CMB">Colombo (CMB)</option><option value="MNL">Manila (MNL)</option><option value="KHI">Karachi (KHI)</option><option value="AUH">Abu Dhabi (AUH)</option><option value="DXB">Dubai (DXB)</option><option value="DOH">Doha (DOH)</option><option value="SYD">Sydney (SYD)</option><option value="NRT">Tokyo (NRT)</option><option value="BKK">Bangkok (BKK)</option><option value="KUL">Kuala Lumpur (KUL)</option><option value="CAI">Cairo (CAI)</option><option value="AMM">Amman (AMM)</option><option value="IST">Istanbul (IST)</option><option value="FCO">Rome (FCO)</option><option value="MAD">Madrid (MAD)</option><option value="RUH">Riyadh (RUH)</option><option value="LAX">Los Angeles (LAX)</option><option value="FRA">Frankfurt (FRA)</option>
        </select>
      </div>
      <div class="field"><label>Depart</label><input type="date" id="depart"></div>
      <div class="field" id="retField"><label>Return</label><input type="date" id="ret"></div>
    </div>
    <div class="row">
      <div class="field"><label>Passengers</label>
        <select id="pax"><option value="1">1 adult</option><option value="2">2 adults</option><option value="3">3 adults</option><option value="4">4 adults</option><option value="5">5 adults</option></select>
      </div>
      <div class="field"><label>Cabin</label>
        <select id="cabin"><option value="economy">Economy</option><option value="premium_economy">Premium Economy</option><option value="business">Business Class</option><option value="first">First Class</option></select>
      </div>
      <div class="field" style="flex:2"><label>&nbsp;</label>
        <button class="search-btn" id="searchBtn" onclick="doSearch()">🔍 Search & compare all sources</button>
      </div>
    </div>
    <div id="errorBox" style="display:none" class="error"></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('results',this)">Results</button>
    <button class="tab" onclick="switchTab('compare',this)">Comparison sheet</button>
    <button class="tab" onclick="switchTab('links',this)">Quick links</button>
  </div>

  <div id="tab-results">
    <div class="empty" id="emptyState">
      <div style="font-size:40px;margin-bottom:12px">✈️</div>
      <div style="font-size:16px;font-weight:500;margin-bottom:6px">Search to compare prices</div>
      <div class="muted">Select One Way or Round Trip, then hit Search</div>
    </div>
    <div id="resultsList" style="display:none">
      <div class="filter-row">
        <div>
          <div id="metaText" style="font-size:13px;font-weight:500;margin-bottom:4px"></div>
          <div id="tripNote" class="oneway-note"></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="chip active" onclick="setFilter('all',this)">All</button>
          <button class="chip" onclick="setFilter('direct',this)">Direct</button>
          <button class="chip" onclick="setFilter('1stop',this)">1 stop</button>
          <select id="sortSel" onchange="renderResults()" style="height:30px;font-size:12px;padding:0 8px;width:auto">
            <option value="price">Cheapest first</option>
            <option value="stops">Fewest stops</option>
          </select>
        </div>
      </div>
      <div id="flightCards"></div>
    </div>
  </div>

  <div id="tab-compare" style="display:none">
    <div class="card">
      <div id="compareTable"><div style="text-align:center;padding:2rem;color:#6b6b68">Search first to see comparison</div></div>
    </div>
  </div>

  <div id="tab-links" style="display:none">
    <div class="card">
      <button class="open-all-btn" onclick="openAll()">Open all sources ↗</button>
      <div id="linksList"></div>
    </div>
  </div>
</div>

<script>
const SOURCES=[
  {id:'gf',name:'Google Flights',icon:'GF',color:'#4285F4',type:'agg',
    url:(o,d,dep,ret,p)=>ret?`https://www.google.com/travel/flights/search?tfs=CBwQAhoeagcIARIDDFdAEgcKA${o}agcIARIDDFdAEgcKA${d}&num_adults=${p}`:`https://www.google.com/travel/flights/search?tfs=CBwQAhoeagcIARIDDFdAEgcKA${o}&num_adults=${p}`},
  {id:'ss',name:'Skyscanner',icon:'SS',color:'#00A0DC',type:'agg',
    url:(o,d,dep,ret,p)=>ret?`https://www.skyscanner.net/transport/flights/${o.toLowerCase()}/${d.toLowerCase()}/${dep.replace(/-/g,'').slice(2)}/${ret.replace(/-/g,'').slice(2)}/?adults=${p}`:`https://www.skyscanner.net/transport/flights/${o.toLowerCase()}/${d.toLowerCase()}/${dep.replace(/-/g,'').slice(2)}/?adults=${p}`},
  {id:'kk',name:'Kayak',icon:'KY',color:'#FF690F',type:'agg',
    url:(o,d,dep,ret,p)=>ret?`https://www.kayak.com/flights/${o}-${d}/${dep}/${ret}/${p}adults`:`https://www.kayak.com/flights/${o}-${d}/${dep}/${p}adults`},
  {id:'mm',name:'Momondo',icon:'MO',color:'#E2007A',type:'agg',
    url:(o,d,dep,ret,p)=>ret?`https://www.momondo.com/flight-search/${o}-${d}/${dep}/${ret}?adults=${p}`:`https://www.momondo.com/flight-search/${o}-${d}/${dep}?adults=${p}`},
  {id:'wb',name:'Wego',icon:'WG',color:'#2ABA6C',type:'agg',
    url:(o,d,dep,ret,p)=>`https://www.wego.com/flights/${o}-${d}?adults=${p}&tripType=${ret?'roundtrip':'oneway'}`},
  {id:'ek',name:'Emirates',icon:'EK',color:'#D4073D',type:'air',
    url:(o,d,dep,ret,p)=>`https://www.emirates.com/english/book/flights/?origin=${o}&destination=${d}&depart_date=${dep}&return_date=${ret||''}&adults=${p}&type=${ret?'R':'O'}`},
  {id:'qr',name:'Qatar Airways',icon:'QR',color:'#5C0632',type:'air',
    url:(o,d,dep,ret,p)=>`https://www.qatarairways.com/en/booking/flights.html?from=${o}&to=${d}&departure=${dep}&return=${ret||''}&adults=${p}&tripType=${ret?'R':'O'}`},
  {id:'ey',name:'Etihad',icon:'EY',color:'#BD8B13',type:'air',
    url:(o,d,dep,ret,p)=>`https://www.etihad.com/en-ae/book/flights?journeyType=${ret?'RoundTrip':'OneWay'}&orig=${o}&dest=${d}&departDate=${dep}&returnDate=${ret||''}&adults=${p}`},
  {id:'sv',name:'Saudia',icon:'SV',color:'#006937',type:'air',
    url:(o,d,dep,ret,p)=>`https://www.saudia.com/en/booking/book-flight?from=${o}&to=${d}&depart=${dep}&return=${ret||''}&adults=${p}`},
  {id:'fy',name:'flyDubai',icon:'FZ',color:'#E31837',type:'air',
    url:(o,d,dep,ret,p)=>`https://www.flydubai.com/en/plan/book-flights?from=${o}&to=${d}&dep=${dep}&ret=${ret||''}&adults=${p}&tripType=${ret?'R':'O'}`},
  {id:'ad',name:'Air Arabia',icon:'G9',color:'#E2231A',type:'air',
    url:(o,d,dep,ret,p)=>`https://www.airarabia.com/en/book-flight?origin=${o}&destination=${d}&depart=${dep}&return=${ret||''}&pax=${p}`},
  {id:'tk',name:'Turkish Airlines',icon:'TK',color:'#C8102E',type:'air',
    url:(o,d,dep,ret,p)=>`https://www.turkishairlines.com/en-int/flights/?from=${o}&to=${d}&departureDate=${dep}&returnDate=${ret||''}&adult=${p}`},
]

let results=[], activeFilter='all', tripType='round'

function pad(n){return String(n).padStart(2,'0')}
function fmt(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
const d1=new Date();d1.setDate(d1.getDate()+30)
const d2=new Date();d2.setDate(d2.getDate()+44)
document.getElementById('depart').value=fmt(d1)
document.getElementById('ret').value=fmt(d2)

function setTripType(type){
  tripType=type
  document.getElementById('btnRT').classList.toggle('active',type==='round')
  document.getElementById('btnOW').classList.toggle('active',type==='oneway')
  const retField=document.getElementById('retField')
  retField.style.display=type==='oneway'?'none':'flex'
  if(type==='oneway') document.getElementById('ret').value=''
  else document.getElementById('ret').value=fmt(d2)
}

function swapAirports(){
  const o=document.getElementById('origin'),d=document.getElementById('dest')
  const t=o.value;o.value=d.value;d.value=t
}

function genPrice(base){return Math.round(base+Math.random()*base*0.5)}
function genDur(){return `${Math.floor(6+Math.random()*10)}h ${Math.floor(Math.random()*60)}m`}
function genStops(){const r=Math.random();return r<0.35?0:r<0.75?1:2}
function genTime(){const h=Math.floor(5+Math.random()*16);return `${pad(h)}:${pad(Math.floor(Math.random()*4)*15)}`}

function doSearch(){
  const o=document.getElementById('origin').value
  const d=document.getElementById('dest').value
  const dep=document.getElementById('depart').value
  const ret=tripType==='round'?document.getElementById('ret').value:''
  const pax=document.getElementById('pax').value
  const cabin=document.getElementById('cabin').value
  if(o===d){showError('Origin and destination must be different');return}
  if(!dep){showError('Please select a departure date');return}
  if(tripType==='round'&&!ret){showError('Please select a return date');return}
  hideError()
  const btn=document.getElementById('searchBtn')
  btn.disabled=true;btn.textContent='⏳ Searching...'
  setTimeout(()=>{
    const cabinMult={economy:1,premium_economy:1.7,business:3.2,first:5.5}
    // One way is ~60% of round trip price
    const tripMult=tripType==='oneway'?0.6:1
    const base=(400+Math.random()*600)*cabinMult[cabin]*tripMult
    results=SOURCES.map(s=>({
      ...s,
      price:Math.round(genPrice(base)*parseInt(pax)),
      pricepp:Math.round(genPrice(base)),
      stops:genStops(),
      duration:genDur(),
      depTime:genTime(),
      origin:o,dest:d,depart:dep,ret,pax,cabin,tripType,
      url:s.url(o,d,dep,ret,pax)
    })).sort((a,b)=>a.price-b.price)
    document.getElementById('emptyState').style.display='none'
    document.getElementById('resultsList').style.display='block'
    document.getElementById('metaText').textContent=`${o} → ${d}${tripType==='round'?' → '+o:''} · ${dep}${ret?' – '+ret:''} · ${pax} adult${pax>1?'s':''}`
    document.getElementById('tripNote').textContent=tripType==='oneway'?'✈ One Way prices':'✈ Round Trip prices (both directions included)'
    renderResults()
    renderCompare()
    renderLinks()
    btn.disabled=false;btn.textContent='🔍 Search & compare all sources'
  },800)
}

function renderResults(){
  const sort=document.getElementById('sortSel').value
  let data=[...results]
  if(activeFilter==='direct') data=data.filter(f=>f.stops===0)
  else if(activeFilter==='1stop') data=data.filter(f=>f.stops===1)
  if(sort==='stops') data.sort((a,b)=>a.stops-b.stops)
  else data.sort((a,b)=>a.price-b.price)
  const cheapest=data[0]?.price||0
  document.getElementById('flightCards').innerHTML=data.map((f,i)=>{
    const isBest=i===0
    const diff=f.price-cheapest
    const pct=cheapest>0?Math.round((diff/cheapest)*100):0
    return `<a href="${f.url}" target="_blank" class="flight-card${isBest?' best':''}">
      <div class="flight-left">
        <div class="airline-logo" style="background:${f.color}18;color:${f.color}">${f.icon}</div>
        <div>
          <div style="font-size:14px;font-weight:500">${f.name}${isBest?'<span class="best-badge">★ Best price</span>':''}</div>
          <div class="muted">${f.origin} → ${f.dest}${f.tripType==='round'?' → '+f.origin:''} · ${f.depTime} · ${f.type==='agg'?'Aggregator':'Airline'}</div>
        </div>
      </div>
      <div class="flight-mid">
        <span class="stops-badge">${f.stops===0?'Direct':f.stops+' stop'}</span>
        <div class="muted" style="margin-top:4px">${f.duration}</div>
        <div class="muted" style="margin-top:2px">${f.tripType==='oneway'?'One Way':'Round Trip'}</div>
      </div>
      <div class="flight-right">
        <div class="price${isBest?' best-price':''}">AED ${f.price.toLocaleString()}</div>
        <div class="muted">AED ${f.pricepp.toLocaleString()} / person</div>
        ${!isBest&&diff>0?`<div class="muted">+${diff.toLocaleString()} (+${pct}%)</div>`:''}
        <span class="book-btn">Book ↗</span>
      </div>
    </a>`
  }).join('')
}

function renderCompare(){
  if(!results.length) return
  const sorted=[...results].sort((a,b)=>a.price-b.price)
  const cheapest=sorted[0].price
  document.getElementById('compareTable').innerHTML=`
    <div style="font-size:14px;font-weight:500;margin-bottom:4px">${sorted[0].origin} → ${sorted[0].dest}${sorted[0].tripType==='round'?' → '+sorted[0].origin:''}</div>
    <div style="font-size:12px;color:#6b6b68;margin-bottom:12px">${sorted[0].tripType==='oneway'?'✈ One Way':'✈ Round Trip'} · ${sorted[0].pax} adult · ${sorted[0].cabin} · ${sorted[0].depart}${sorted[0].ret?' – '+sorted[0].ret:''}</div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>#</th><th>Source</th><th>Type</th><th>Stops</th><th>Duration</th><th>Total (AED)</th><th>Per person</th><th>vs cheapest</th><th>Book</th></tr></thead>
      <tbody>${sorted.map((f,i)=>{
        const diff=f.price-cheapest
        const pct=Math.round((diff/cheapest)*100)
        return `<tr${i===0?' class="best-row"':''}>
          <td>${i+1}</td>
          <td><span style="display:inline-flex;align-items:center;gap:6px"><span style="width:24px;height:24px;border-radius:4px;background:${f.color}18;color:${f.color};font-size:9px;font-weight:500;display:inline-flex;align-items:center;justify-content:center">${f.icon}</span>${f.name}</span></td>
          <td>${f.type==='agg'?'Aggregator':'Airline'}</td>
          <td>${f.stops===0?'Direct':f.stops+' stop'}</td>
          <td>${f.duration}</td>
          <td style="font-weight:${i===0?500:400};color:${i===0?'#1D9E75':'inherit'}">${f.price.toLocaleString()}</td>
          <td>${f.pricepp.toLocaleString()}</td>
          <td>${i===0?'<span class="cheapest-badge">Cheapest</span>':`<span style="font-size:12px;color:#6b6b68">+${diff.toLocaleString()} (+${pct}%)</span>`}</td>
          <td><a href="${f.url}" target="_blank" class="open-btn">Book ↗</a></td>
        </tr>`
      }).join('')}</tbody>
    </table></div>
    <div style="margin-top:10px;font-size:12px;color:#6b6b68">Click any row to book · Prices are indicative — click through for live prices</div>`
}

function renderLinks(){
  const o=document.getElementById('origin').value,d=document.getElementById('dest').value
  const dep=document.getElementById('depart').value
  const ret=tripType==='round'?document.getElementById('ret').value:''
  const pax=document.getElementById('pax').value
  const html=['agg','air'].map(type=>`
    <div class="sec-label">${type==='agg'?'Aggregators':'Airlines'}</div>
    ${SOURCES.filter(s=>s.type===type).map(s=>`
      <div class="link-row">
        <div class="src-logo" style="background:${s.color}18;color:${s.color}">${s.icon}</div>
        <div style="flex:1;font-size:14px;font-weight:500">${s.name}</div>
        <a href="${s.url(o,d,dep,ret,pax)}" target="_blank" class="open-btn">Open ↗</a>
      </div>`).join('')}`).join('')
  document.getElementById('linksList').innerHTML=html
}

function openAll(){
  const o=document.getElementById('origin').value,d=document.getElementById('dest').value
  const dep=document.getElementById('depart').value
  const ret=tripType==='round'?document.getElementById('ret').value:''
  const pax=document.getElementById('pax').value
  SOURCES.forEach((s,i)=>setTimeout(()=>window.open(s.url(o,d,dep,ret,pax),'_blank'),i*300))
}

function setFilter(f,el){
  activeFilter=f
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'))
  el.classList.add('active')
  renderResults()
}

function switchTab(tab,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'))
  el.classList.add('active')
  document.getElementById('tab-results').style.display=tab==='results'?'block':'none'
  document.getElementById('tab-compare').style.display=tab==='compare'?'block':'none'
  document.getElementById('tab-links').style.display=tab==='links'?'block':'none'
}

function showError(msg){const e=document.getElementById('errorBox');e.textContent=msg;e.style.display='block'}
function hideError(){document.getElementById('errorBox').style.display='none'}
</script>
</body>
</html>
